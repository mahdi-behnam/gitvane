[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitvane-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for GitVane architectural impact analysis, test recommendation, and risk intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "GitVane Team" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "gitvane",
    "code-analysis",
    "ast",
    "impact-analysis",
    "test-recommendation",
    "risk-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
]

[project.scripts]
gitvane-mcp = "gitvane_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/mahdi-behnam/gitvane"
Repository = "https://github.com/mahdi-behnam/gitvane"

[tool.hatch.build.targets.wheel]
packages = ["gitvane_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
