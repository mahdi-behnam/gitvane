[project]
name = "gitvane-backend"
version = "0.1.0"
description = "FastAPI backend for GitVane change prediction system"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "fastapi>=0.100.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0",
    "uvicorn[standard]>=0.22.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.28.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.11.0",
    "redis>=5.0.0",
    "rq>=1.15.0",
    "gitpython>=3.1.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.0",
    "networkx>=3.0",
    "sentence-transformers>=2.2.0",
    "torch==2.5.1+cu121",
    "numpy>=1.24.0",
    "httpx>=0.24.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "pgvector>=0.2.0",
    "bcrypt",
    "pyjwt",
    "cryptography",
    "celery>=5.3.0",
    "kombu>=5.3.0",
    "email-validator>=2.3.0",
]

[project.scripts]
gitvane-dispatcher = "app.cli.dispatcher:main"
gitvane-reconciler = "app.cli.reconciler:main"


[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "aiosqlite>=0.19.0",
]


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"




