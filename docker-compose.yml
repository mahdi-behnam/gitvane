services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gitvane-postgres
    environment:
      POSTGRES_USER: gitvane
      POSTGRES_PASSWORD: gitvane
      POSTGRES_DB: gitvane
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitvane"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: gitvane-pgbouncer
    ports:
      - "6432:6432"
    environment:
      - DB_USER=gitvane
      - DB_PASSWORD=gitvane
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=gitvane
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - MAX_PREPARED_STATEMENTS=100
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: gitvane-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    container_name: gitvane-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gitvane-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://gitvane:gitvane@pgbouncer:6432/gitvane
      - SYNC_DATABASE_URL=postgresql+psycopg://gitvane:gitvane@pgbouncer:6432/gitvane
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - GITVANE_WORKSPACE=/workspace/repos
      - APP_NAME=GitVane
      - ENVIRONMENT=docker
      - DEBUG=true
    volumes:
      - ./backend:/app
      - repos_volume:/workspace/repos
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  outbox-dispatcher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gitvane-outbox-dispatcher
    command: python -m app.cli.dispatcher
    environment:
      - DATABASE_URL=postgresql+asyncpg://gitvane:gitvane@pgbouncer:6432/gitvane
      - SYNC_DATABASE_URL=postgresql+psycopg://gitvane:gitvane@pgbouncer:6432/gitvane
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - GITVANE_WORKSPACE=/workspace/repos
      - APP_NAME=GitVane
      - ENVIRONMENT=docker
      - DEBUG=true
    depends_on:
      pgbouncer:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  reconciler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gitvane-reconciler
    command: python -m app.cli.reconciler
    environment:
      - DATABASE_URL=postgresql+asyncpg://gitvane:gitvane@pgbouncer:6432/gitvane
      - SYNC_DATABASE_URL=postgresql+psycopg://gitvane:gitvane@pgbouncer:6432/gitvane
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - GITVANE_WORKSPACE=/workspace/repos
      - APP_NAME=GitVane
      - ENVIRONMENT=docker
      - DEBUG=true
    depends_on:
      pgbouncer:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker-cpu:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gitvane-celery-worker-cpu
    command: celery -A app.core.celery_app worker -Q indexing_cpu,workflow_control,evaluation_cpu --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql+asyncpg://gitvane:gitvane@pgbouncer:6432/gitvane
      - SYNC_DATABASE_URL=postgresql+psycopg://gitvane:gitvane@pgbouncer:6432/gitvane
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - GITVANE_WORKSPACE=/workspace/repos
      - APP_NAME=GitVane
      - ENVIRONMENT=docker
      - DEBUG=true
    volumes:
      - ./backend:/app
      - repos_volume:/workspace/repos
    depends_on:
      pgbouncer:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: gitvane-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  repos_volume:
  huggingface_cache:
